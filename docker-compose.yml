services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: face-anime-api:gpu
    container_name: face-anime-backend
    ports:
      - "8000:8000"
    environment:
      CHECKPOINT_DIR: /app/checkpoints
    volumes:
      - model_cache:/app/checkpoints
    # gpus: all
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: face-anime-frontend:latest
    container_name: face-anime-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  model_cache: